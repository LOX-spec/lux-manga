services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:preview
    environment:
      TZ: Asia/Riyadh
      BIND_IP: 0.0.0.0
      BIND_PORT: 4567
      AUTH_MODE: basic_auth
      AUTH_USERNAME: ${SUWAYOMI_USERNAME:?Set SUWAYOMI_USERNAME}
      AUTH_PASSWORD: ${SUWAYOMI_PASSWORD:?Set SUWAYOMI_PASSWORD}
      EXTENSION_STORES: '["https://github.com/keiyoushi/extensions/raw/repo/index.pb"]'
    volumes:
      - suwayomi-data:/home/suwayomi/.local/share/Tachidesk
    ports:
      - "127.0.0.1:4567:4567"
    restart: unless-stopped
volumes:
  suwayomi-data:
